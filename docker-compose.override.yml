# Local host ports and test services. Dokploy runs with -f docker-compose.yml and does not load this file.
services:
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin

  clamav:
    ports:
      - "3310:3310"

  api:
    environment:
      NODE_ENV: development
      FIREBASE_PROJECT_ID: monytix-test
      FINANCE_BACKEND_URL: ${FINANCE_BACKEND_URL:-http://host.docker.internal:8090}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: statements
      OBJECT_STORAGE_ACCESS_KEY_ID: minio
      OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./.local/public.pem:/run/e2e/public.pem:ro
    entrypoint:
      - /bin/sh
      - -c
      - export MONYTIX_AUTH_PUBLIC_KEY_PEM="$$(cat /run/e2e/public.pem)" && exec node dist/main.js
    ports:
      - "8080:8080"
    depends_on:
      minio:
        condition: service_started

  scanner:
    environment:
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: statements
      OBJECT_STORAGE_ACCESS_KEY_ID: minio
      OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      minio:
        condition: service_started
