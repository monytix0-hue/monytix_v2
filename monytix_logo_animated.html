<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monytix — Animated Logo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0D1B2A;
  --btn-color: rgba(255,255,255,0.45);
  --btn-hover: rgba(255,255,255,0.9);
  --btn-border: rgba(255,255,255,0.14);
  --btn-border-hover: rgba(255,255,255,0.4);
  --lbl: rgba(255,255,255,0.2);
}
body.light {
  --bg: #F0EDE6;
  --btn-color: rgba(0,0,0,0.38);
  --btn-hover: rgba(0,0,0,0.8);
  --btn-border: rgba(0,0,0,0.12);
  --btn-border-hover: rgba(0,0,0,0.34);
  --lbl: rgba(0,0,0,0.2);
}

html, body { width: 100%; height: 100%; }
body {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  transition: background 0.5s ease;
  font-family: -apple-system, sans-serif;
}

.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 40px 24px;
}

/* ── O-MARK CANVAS ── */
.omark-wrap {
  position: relative;
  width: 96px;
  height: 96px;
}

/* The loader ring + segments share this canvas */
#loader-canvas {
  position: absolute;
  inset: 0;
  width: 96px;
  height: 96px;
}

/* Segments SVG sits on top, hidden until reveal */
#segs-svg {
  position: absolute;
  inset: 0;
  width: 96px;
  height: 96px;
  opacity: 0;
}

.seg { opacity: 0; }

/* ── WORDMARK ── */
.wordmark-wrap {
  position: relative;
  width: 300px;
  max-width: 64vw;
  height: 48px;
  overflow: hidden; /* clip mask for the reveal wipe */
}

/* Base wordmark — always rendered, clipped */
#wm-base {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* The reveal mask — white rect that moves left→right */
#wm-mask-rect {
  /* We'll drive this via JS clip-path */
}

/* ── CONTROLS ── */
.controls {
  display: flex;
  gap: 12px;
  align-items: center;
}
.btn {
  background: transparent;
  border: 1px solid var(--btn-border);
  color: var(--btn-color);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 9px 22px;
  border-radius: 24px;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.btn:hover { border-color: var(--btn-border-hover); color: var(--btn-hover); }
.lbl {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--lbl);
  transition: color 0.3s;
}
</style>
</head>
<body>

<div class="stage">

  <!-- O-MARK -->
  <div class="omark-wrap">

    <!-- Canvas for the animated loader ring -->
    <canvas id="loader-canvas" width="96" height="96"></canvas>

    <!-- Segments appear after loader completes -->
    <svg id="segs-svg" xmlns="http://www.w3.org/2000/svg" viewBox="308 278 134 148">

      <!-- M -->
      <path fill="url(#gm)" d="M180.5,400.78c-1.44-1.3-2.16-3.11-2.16-5.44v-59.37c0-10.5,3-18.72,8.99-24.67,5.99-5.95,14.19-8.92,24.6-8.92,5.3,0,10.29,1.35,14.98,4.04,4.69,2.7,8.52,6.41,11.5,11.15,2.97-4.83,6.78-8.57,11.43-11.22,4.64-2.65,9.76-3.97,15.33-3.97,10.5,0,18.69,2.97,24.6,8.92,5.9,5.94,8.85,14.17,8.85,24.67v59.37c0,2.23-.72,4.02-2.16,5.37-1.44,1.34-3.37,2.02-5.78,2.02s-4.35-.65-5.79-1.95c-1.44-1.3-2.16-3.11-2.16-5.44v-59.37c0-7.16-1.42-12.41-4.25-15.75-2.84-3.34-7.46-5.02-13.87-5.02-5.85,0-10.36,1.81-13.52,5.44-3.16,3.62-4.74,8.73-4.74,15.33v59.37c0,2.32-.72,4.14-2.16,5.44-1.44,1.3-3.37,1.95-5.78,1.95s-4.3-.65-5.64-1.95c-1.35-1.3-2.02-3.11-2.02-5.44v-59.37c0-6.5-1.63-11.59-4.88-15.26-3.25-3.67-7.71-5.51-13.38-5.51-6.51,0-11.17,1.67-14.01,5.02-2.84,3.34-4.25,8.6-4.25,15.75v59.37c0,2.23-.72,4.02-2.16,5.37-1.44,1.34-3.37,2.02-5.78,2.02s-4.34-.65-5.78-1.95Z"/>
      <!-- O segments in wordmark -->
      <path fill="#313a96" d="M382.05,416.2c-2.98.43-5.91.64-8.95.64-35.06,0-63.67-27.76-65-62.49h23.44c1.39,21.79,19.5,39.11,41.56,39.11,1.17,0,2.29-.05,3.41-.21l5.54,22.96Z"/>

      <path fill="#f9c515" d="M383.54,287.38l-4.9,22.91c-1.81-.21-3.62-.37-5.49-.37-22.11,0-40.28,17.32-41.66,39.11h-23.39c1.33-34.74,30-62.49,65.05-62.49,3.57,0,7.03.32,10.39.85Z"/>
      <path fill="#f47521" d="M437.21,339.86l-22.96,4.58-3.44.68c.37,2.13.56,4.32.56,6.55,0,18.24-12.84,33.54-29.96,37.33l.82,3.42,5.51,22.75.83,3.4c30.45-7.03,53.21-34.35,53.21-66.9,0-4.27-.39-8.45-1.15-12.5l-3.43.68Z"/>
      <!-- N -->
      <path fill="url(#gn)" d="M452.51,400.78c-1.39-1.3-2.09-3.11-2.09-5.44v-54.08c0-12.17,3.79-21.69,11.36-28.57,7.57-6.88,18-10.31,31.29-10.31,8.73,0,16.31,1.56,22.72,4.67,6.41,3.12,11.31,7.6,14.7,13.45,3.39,5.86,5.09,12.78,5.09,20.77v54.08c0,2.32-.7,4.14-2.1,5.44-1.39,1.3-3.29,1.95-5.71,1.95s-4.34-.68-5.79-2.02c-1.44-1.35-2.17-3.14-2.17-5.37v-54.49c0-8.27-2.32-14.64-6.97-19.1-4.64-4.46-11.24-6.69-19.79-6.69s-15.17,2.25-19.86,6.76c-4.69,4.51-7.04,10.85-7.04,19.03v54.49c0,2.23-.72,4.02-2.16,5.37-1.44,1.34-3.37,2.02-5.78,2.02s-4.32-.65-5.71-1.95Z"/>
      <!-- Y -->
      <path fill="url(#gy)" d="M629.79,304.34c1.4,1.3,2.09,3.11,2.09,5.44v15.61c0,12.27-3.14,22.3-9.41,30.1-6.27,7.8-14.93,12.5-25.99,14.08v25.78c0,2.23-.72,4.02-2.16,5.37-1.44,1.34-3.37,2.02-5.79,2.02s-4.34-.65-5.79-1.95c-1.44-1.3-2.16-3.11-2.16-5.44v-25.78c-11.15-1.58-19.86-6.23-26.13-13.94-6.27-7.71-9.41-17.79-9.41-30.24v-15.61c0-2.32.72-4.13,2.16-5.44,1.44-1.3,3.36-1.95,5.78-1.95s4.34.67,5.78,2.02c1.44,1.35,2.16,3.13,2.16,5.36v16.03c0,10.13,2.39,17.93,7.18,23.41,4.78,5.48,11.59,8.22,20.42,8.22s15.49-2.76,20.28-8.29c4.79-5.53,7.18-13.31,7.18-23.34v-16.03c0-2.23.75-4.02,2.23-5.36,1.49-1.35,3.43-2.02,5.85-2.02s4.32.65,5.71,1.95Z"/>
      <!-- T -->
      <path fill="url(#gt)" d="M683.03,397.72v-86.41h-32.89c-3.16,0-4.74-1.21-4.74-3.62,0-1.39.39-2.39,1.18-3,.79-.6,1.97-.91,3.55-.91h74.84c3.16,0,4.74,1.3,4.74,3.9,0,2.42-1.58,3.62-4.74,3.62h-32.89v86.41c0,1.58-.42,2.81-1.25,3.69-.84.88-1.95,1.33-3.35,1.33-2.98,0-4.46-1.68-4.46-5.02Z"/>
      <!-- I -->
      <path fill="url(#gi)" d="M750.83,401.41c-.79-.88-1.18-2.11-1.18-3.69v-90.31c0-3.34,1.49-5.02,4.46-5.02,1.4,0,2.49.44,3.28,1.32.79.88,1.19,2.12,1.19,3.69v90.31c0,1.58-.4,2.81-1.19,3.69-.79.88-1.88,1.33-3.28,1.33s-2.48-.44-3.28-1.33Z"/>
      <!-- X -->
      <path fill="url(#gx)" d="M857.66,398.83c0,1.3-.56,2.33-1.67,3.07-.83.56-1.63.84-2.37.84-1.3,0-2.6-.84-3.9-2.51l-33.73-42.37-33.73,42.37c-1.21,1.67-2.51,2.51-3.9,2.51-.75,0-1.54-.28-2.37-.84-1.02-.74-1.54-1.76-1.54-3.07,0-.93.37-1.9,1.12-2.93l35.4-44.46-33.73-42.23c-.65-.74-.97-1.72-.97-2.93,0-1.39.51-2.42,1.53-3.07.84-.55,1.58-.83,2.23-.83,1.21,0,2.51.83,3.9,2.51l32.06,40.28,32.06-40.28c1.3-1.67,2.6-2.51,3.9-2.51.84,0,1.58.28,2.23.83,1.12.65,1.67,1.67,1.67,3.07,0,.93-.37,1.91-1.11,2.93l-33.59,42.23,35.4,44.46c.74,1.02,1.11,2,1.11,2.93Z"/>

      <!-- Shimmer sweep overlay (driven by JS) -->
      <rect id="shimmer-rect" x="140" y="278" width="740" height="140"
        fill="url(#shimmer)"
        style="mix-blend-mode:screen; opacity:0; pointer-events:none;"/>
    </svg>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn" onclick="replay()">↺ replay</button>
    <span class="lbl" id="lbl">night sky</span>
    <button class="btn" onclick="toggleTheme()" id="tbtn">morning mist</button>
  </div>

</div>

<script>
  const canvas   = document.getElementById('loader-canvas');
  const ctx      = canvas.getContext('2d');
  const segsEl   = document.getElementById('segs-svg');
  const segPaths = ['s-yellow','s-blue','s-orange','s-navy'].map(id => document.getElementById(id));
  const wmWrap   = document.getElementById('wm-wrap');
  const shimmerRect = document.getElementById('shimmer-rect');
  const shimmerGrad = document.getElementById('shimmer');

  // Segment colours for the loader arcs (match SVG fills)
  const segColors = ['#f9c515', '#55c2ef', '#f47521', '#313a96'];
  // Each segment spans ~90° of the circle, drawn in order
  // Starting from top (-π/2), going clockwise
  const TWO_PI = Math.PI * 2;
  const START  = -Math.PI / 2; // 12 o'clock

  const CX = 48, CY = 48, R = 35, STROKE = 8;

  let isLight = false;
  let running = false;
  let raf = null;

  const easeOut   = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
  const easeBack  = t => { const c = 2.70158; return 1 + c*Math.pow(t-1,3) + (c-1)*Math.pow(t-1,2); };

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
  function tween(fn, ms) {
    return new Promise(res => {
      const t0 = performance.now();
      function f(now) {
        const p = Math.min((now - t0) / ms, 1);
        fn(p); p < 1 ? requestAnimationFrame(f) : res();
      }
      requestAnimationFrame(f);
    });
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // Draw a single arc segment on the canvas
  function drawArc(color, startAngle, endAngle, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth   = STROKE;
    ctx.lineCap     = 'butt';
    ctx.beginPath();
    ctx.arc(CX, CY, R, startAngle, endAngle, false);
    ctx.stroke();
    ctx.restore();
  }

  // Draw the track ring (dim background ring)
  function drawTrack(alpha = 0.08) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#8ABC9E';
    ctx.lineWidth   = STROKE;
    ctx.lineCap     = 'butt';
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, TWO_PI, false);
    ctx.stroke();
    ctx.restore();
  }

  function reset() {
    clearCanvas();
    segsEl.style.opacity   = '0';
    segsEl.style.transform = 'scale(0.85)';
    segsEl.style.transition = 'none';
    segPaths.forEach(s => { s.style.opacity = '0'; });
    wmWrap.style.clipPath = 'inset(0 100% 0 0)';
    shimmerRect.style.opacity = '0';
  }

  async function runAnimation() {
    if (running) return;
    running = true;
    reset();
    await wait(150);

    // ── PHASE 1: Track fades in ───────────────────────────
    await tween(t => {
      clearCanvas();
      drawTrack(easeOut(t) * 0.1);
    }, 350);

    // ── PHASE 2: Single loader arc sweeps around 360° ─────
    // One clean amber arc races around the full circle
    const loaderColor = '#C4956A';
    await tween(t => {
      const p = easeInOut(t);
      clearCanvas();
      drawTrack(0.1);
      // Arc grows from 0 → 360
      drawArc(loaderColor, START, START + p * TWO_PI);
    }, 900);

    await wait(60);

    // ── PHASE 3: Loader splits into 4 coloured segments ───
    // Each segment = 90° of the circle
    // Animate them "peeling" in with a stagger, loader fades out
    await tween(t => {
      clearCanvas();
      drawTrack(0.1 * (1 - easeOut(t)));
      // Loader arc fades out as segments scale in
      drawArc(loaderColor, START, START + TWO_PI, 1 - easeOut(t));
    }, 250);

    // Flash transition: segments SVG snaps in
    clearCanvas();
    segsEl.style.transition = 'opacity 0.18s ease, transform 0.4s cubic-bezier(0.34,1.56,0.64,1)';
    segsEl.style.opacity    = '1';
    segsEl.style.transform  = 'scale(1)';

    // Stagger each segment opacity
    segPaths.forEach((s, i) => {
      setTimeout(() => {
        s.style.transition = 'opacity 0.22s ease';
        s.style.opacity    = '1';
      }, i * 60);
    });

    await wait(420);

    // ── PHASE 4: Wordmark wipes in left → right ───────────
    await tween(t => {
      const p = easeInOut(t);
      // clip-path reveals from left to right
      const pct = (1 - p) * 100;
      wmWrap.style.clipPath = `inset(0 ${pct}% 0 0)`;
    }, 700);

    await wait(200);

    // ── PHASE 5: Gold shimmer sweep ───────────────────────
    shimmerRect.style.opacity = '1';
    await tween(t => {
      const p = easeInOut(t);
      // Move shimmer gradient from left of SVG to right
      const x1 = -80 + p * 260;
      const x2 = x1 + 60;
      shimmerGrad.setAttribute('x1', `${x1}%`);
      shimmerGrad.setAttribute('x2', `${x2}%`);
    }, 700);
    shimmerRect.style.opacity = '0';

    await wait(600);
    running = false;
  }

  function replay() { runAnimation(); }

  function toggleTheme() {
    isLight = !isLight;
    document.body.classList.toggle('light', isLight);
    document.getElementById('tbtn').textContent = isLight ? 'night sky'    : 'morning mist';
    document.getElementById('lbl').textContent  = isLight ? 'morning mist' : 'night sky';
    setTimeout(runAnimation, 300);
  }

  window.addEventListener('load', () => setTimeout(runAnimation, 400));
</script>
</body>
</html>
