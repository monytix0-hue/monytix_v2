openapi: 3.1.0
info:
  title: Monytix API
  version: 0.1.0
  summary: Public HTTP contract for the Monytix mobile apps.
servers:
  - url: http://localhost:3000
paths:
  /auth:
    get:
      operationId: getAuth
      summary: Authentication stub.
      responses:
        "200":
          description: Auth module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /users:
    get:
      operationId: getUsers
      summary: User profiles stub.
      responses:
        "200":
          description: Users module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /accounts:
    get:
      operationId: getAccounts
      summary: Financial accounts stub.
      responses:
        "200":
          description: Accounts module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /transactions:
    get:
      operationId: getTransactions
      summary: Ledger transactions stub.
      responses:
        "200":
          description: Transactions module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /sources:
    get:
      operationId: getSources
      summary: Ingestion sources stub.
      responses:
        "200":
          description: Sources module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /statements:
    get:
      operationId: getStatements
      summary: Statement documents stub.
      responses:
        "200":
          description: Statements module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /personal:
    get:
      operationId: getPersonal
      summary: Personal finance views stub.
      responses:
        "200":
          description: Personal module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /business:
    get:
      operationId: getBusiness
      summary: Business finance views stub.
      responses:
        "200":
          description: Business module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /decisions:
    get:
      operationId: getDecisions
      summary: Decision records stub.
      responses:
        "200":
          description: Decisions module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /missions:
    get:
      operationId: getMissions
      summary: Mission plans stub.
      responses:
        "200":
          description: Missions module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /nudges:
    get:
      operationId: getNudges
      summary: Nudge delivery stub.
      responses:
        "200":
          description: Nudges module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /projections:
    get:
      operationId: getProjections
      summary: Cash projections stub.
      responses:
        "200":
          description: Projections module stub.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleStub"
  /v1/transactions:
    get:
      operationId: listLedgerTransactions
      summary: Current canonical transactions for the authenticated owner.
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50 }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: accountId
          schema: { type: string, format: uuid }
        - in: query
          name: direction
          schema: { type: string, enum: [IN, OUT] }
      responses:
        "200":
          description: Ledger read v0.1 page. Missing interpretations stay null.
  /v1/transactions/{logicalTransactionId}:
    patch:
      operationId: correctLedgerTransaction
      summary: Correct amount, direction, date, description, category, or weight. Account and currency stay locked.
      description: Inserts canonical version n + 1 with USER_CORRECTION provenance and activates it. The prior version is retained.
      parameters:
        - in: path
          name: logicalTransactionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_version_id: { type: string, format: uuid }
                amount: { type: string, pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,4})?$" }
                direction: { type: string, enum: [IN, OUT] }
                occurred_at: { type: string, format: date-time }
                description: { type: string }
                category_id: { type: string }
                subcategory_id: { type: string }
                weight_code: { type: string }
      responses:
        "200":
          description: Corrected movement. Version n + 1 is current.
        "404":
          description: No active movement for this owner.
        "409":
          description: stale_version when expected_version_id is no longer current, or idempotency_conflict.
        "422":
          description: invalid_request, or incomplete_transaction when the resulting version could not be READY.
    delete:
      operationId: deleteLedgerTransaction
      summary: Permanently delete a recorded movement.
      parameters:
        - in: path
          name: logicalTransactionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted. The ingestion source record and its disposition are kept as audit.
        "404":
          description: No active movement for this owner.
  /v1/accounts/summaries:
    get:
      operationId: listAccountSummaries
      summary: Account totals and an available balance only when a snapshot exists.
      responses:
        "200":
          description: Account summary v0.1.
  /v1/finance/overview:
    get:
      operationId: getFinanceOverview
      summary: Recorded inflow and outflow by currency. Ordinary outflow excludes transfers, credit-card payments, and loan repayments.
      responses:
        "200":
          description: Finance overview v0.1.
  /v1/molybot/ask:
    post:
      operationId: askMolybot
      summary: Deterministic ledger answers. No external model.
      responses:
        "200":
          description: MolyBot read v0.1.
  /platform/health:
    get:
      operationId: getPlatformHealth
      summary: API process health.
      responses:
        "200":
          description: Platform health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    ModuleStub:
      type: object
      additionalProperties: false
      required: [module, status]
      properties:
        module:
          type: string
        status:
          const: stub
    Health:
      type: object
      additionalProperties: false
      required: [module, status]
      properties:
        module:
          const: platform
        status:
          const: ok
