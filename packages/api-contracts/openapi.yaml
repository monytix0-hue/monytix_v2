components:
  schemas:
    ModuleStub:
      type: object
      additionalProperties: false
      required: [module, status]
      properties:
        module:
          type: string
        status:
          const: stub
    Health:
      type: object
      additionalProperties: false
      required: [module, status]
      properties:
        module:
          const: platform
        status:
          const: ok
